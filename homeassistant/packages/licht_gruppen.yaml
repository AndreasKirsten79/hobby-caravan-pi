# ============================================================
# LICHT-GRUPPEN & KILL-SWITCH
# ============================================================

input_boolean:
  wowa_automationen_aktiv:
    name: "WoWa Automationen aktiv"
    icon: mdi:robot

light:
  - platform: group
    name: "WoWa Ambientelicht"
    unique_id: wowa_ambientelicht_gruppe
    entities:
      - light.wowa_ambientelicht_1
      - light.wowa_ambientelicht_2
      - light.wowa_ambientelicht_3

  - platform: group
    name: "WoWa Wandlicht & Bett"
    unique_id: wowa_wandlicht_bett_gruppe
    entities:
      - light.wowa_wandlicht
      - light.wowa_bettlicht_links
      - light.wowa_bettlicht_rechts

automation:
  # Kill-Switch AUS → alle Automationen deaktivieren
  - id: wowa_killswitch_aus
    alias: "WoWa: Automationen deaktivieren"
    trigger:
      - platform: state
        entity_id: input_boolean.wowa_automationen_aktiv
        to: "off"
    action:
      - service: automation.turn_off
        target:
          entity_id:
            - automation.wowa_ambientelicht_bei_sonnenuntergang
            - automation.wowa_aussenlicht_bei_dammerung
            - automation.markise_vorwarnung_wind_30_km_h
            - automation.markise_alarm_wind_50_km_h
            - automation.dachfenster_regen_kommt
            - automation.dachfenster_regen_jetzt
            - automation.aussenlicht_bei_turoffnung_dunkelheit
    mode: single

  # Kill-Switch AN → alle Automationen aktivieren
  - id: wowa_killswitch_an
    alias: "WoWa: Automationen aktivieren"
    trigger:
      - platform: state
        entity_id: input_boolean.wowa_automationen_aktiv
        to: "on"
    action:
      - service: automation.turn_on
        target:
          entity_id:
            - automation.wowa_ambientelicht_bei_sonnenuntergang
            - automation.wowa_aussenlicht_bei_dammerung
            - automation.markise_vorwarnung_wind_30_km_h
            - automation.markise_alarm_wind_50_km_h
            - automation.dachfenster_regen_kommt
            - automation.dachfenster_regen_jetzt
            - automation.aussenlicht_bei_turoffnung_dunkelheit
    mode: single
